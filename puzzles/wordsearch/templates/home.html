{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>wordsearch</title>
        <link rel="stylesheet" href="{% static 'style.css'%}" />
    </head>
    <body class="flexbox">
        <h2>Shreekrishna</h2>

        <div class="masterbox flexbox">
            <div class="mainbox flexbox">
                <form class="container flexbox" method="POST">
                    {% csrf_token %} {% for char in chars %}

                    <input
                        type="checkbox"
                        name="characters"
                        id="id{{char.index}}"
                        class="charinput"
                        value="{{char}}{{char.index}}"
                    />
                    <label
                        for="id{{char.index}}"
                        class="char{{char.index}} flexbox"
                        style="color:{% if char.char_checked %} blue {% else %} green {% endif %};
                background-color:{% if char.char_checked %}  #093412 {% else %} transperent {% endif %}
                "
                        >{{char | upper}}</label
                    >

                    {% endfor %}
                    <button type="submit">Check</button>
                </form>
            </div>
            <div class="words flexbox">
                {% for word in words %}
                <p
                    class="word"
                    style="background-color:{% if word.word_checked%} #004223{% else  %} #420023 {% endif %}"
                >
                    {{word.word | upper}}
                </p>
                {% endfor %}
            </div>
            
            <form  method="post" class="start-form {% if start_game %} hidden {% else %} '' {% endif %}">
                {% csrf_token %}
                <input type="checkbox" name="start_puzzle" id="start_puzzle" value="@#$" checked>
                <label for="start_puzzle" value="@#$"></label>
                <button type="submit">START</button>
            </form>


        </div>
        <script src="{% static 'wordsearch/script.js' %}"></script>
    </body>
</html>
