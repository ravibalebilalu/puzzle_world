{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="{% static 'sudoku.css' %}" />
    </head>
    <body  >
           <h1>SHREEKRISHNA</h1>
        <div class="container">
         
            <div class="playboard">
               {% for cell in cells %}
                <div class="cells">
                    {% if cell.cell_value %}{{cell.cell_value}}{% else %}0{%endif %}
                </div>

                {% endfor %} 
            </div>
       <div class="editor">
                {% for num in "123456789" %}
                <div>{{num}}</div>
                {% endfor %}
            </div> 
        </div>
    </body>
</html>
