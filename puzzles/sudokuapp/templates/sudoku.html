{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="{% static 'sudoku.css' %}" />
    </head>
    <body>
        <div class="container">
           
            <form class="playboard" method="post" action="{% url 'sudoku' %}">
                {% csrf_token %} {% for cell in cells %}
                <input
                    type="radio"
                    name="selected"
                    id="cell-id-{{cell.cell_index}}"
                    class="cellid"
                    value="{{cell.cell_index}}"
                />
                <label for="cell-id-{{cell.cell_index}}" class="cells flexbox"
                    >{{ cell.cell_value|default:"." }}</label
                >

                {% endfor %}

                <div class="editor">
                    {% for num in "123456789" %}
                    <button
                        type="submit"
                        name="number"
                        value="{{num}}"
                        class="nums flexbox"
                        value="{{num}}"
                    >
                        {{ num }}
                    </button>
                    {% endfor %}
                </div>
            </form>
        </div>
    </body>
</html>
