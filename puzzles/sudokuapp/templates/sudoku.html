{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="{% static 'sudoku.css' %}" />
    </head>
    <body  >
          
        <div class="container">
         
            <form class="playboard"  method="post">
                {% csrf_token %}
               {% for cell in cells %}

                 <button type="submit" name="selected" value="{{ cell.cell_index }}-{{ cell.cell_value|default:"" }}"
                  class="cells flexbox"
                   style="opacity:{% if cell %} 1 {% else %} 0 {% endif %};"
                  >
            {{ cell.cell_value|default:" ." }}
        </button>
                   
            

                {% endfor %} 
        </form>

          
       <form class="editor" method="post">
        {% csrf_token %}
                {% for num in "123456789" %}
               <button type="submit" name="number" value="{{num}}" class="nums flexbox">
            {{  num }}
        </button>
                {% endfor %}
            </div> 
        </div>
    </body>
</html>
