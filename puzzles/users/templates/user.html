<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>User</title>
        <style>
            body {
                background-color: #000;
                color: #ffe;
            }
            h1 {
                text-align: center;
                color: burlywood;
            }
            .flexbox {
                display: flex;
                justify-content: center;
                align-items: center;
                flex-direction: column;
                font-size: 20px;
            }
            a {
                text-decoration: none;
            }
            .wordsearch {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }
            .wordsearch .play {
                text-align: center;
                color: rgb(69, 69, 27);
                font-size: 30px;
                font-weight: bold;
                box-shadow: 1px 1px 3px #ffd, -1px -1px 3px #ffd;
                border-radius: 20px;
                padding: 5px;
                margin: 0px 10px;
                animation: play 0.5s linear infinite;
            }
            
            .wordsearch p {
                text-align: center;
                color: rgb(63, 19, 152);
                font-size: 30px;
                font-weight: bold;
                 
            }
         
            @keyframes play {
                50% {
                    box-shadow: 1px 1px 0px, -1px -1px 0px;
                }
            }
            p{
                margin:20px 4px;
                text-align: center;
            }
            .metrics{
                font-size:30px;
                outline: 2px solid #fff;
                opacity: .6;
                margin-top: 40px;
            }
        </style>
    </head>
    <body>
        <h1>PUZZLE WORLD</h1>

        <div class="flexbox">
            <p>
                Don't have an account?    </p>
                <a href="{% url 'register' %}">Create Here</a>
        
            <p>Have an account ?</p> <a style="margin-bottom:20px;" href="{% url 'login' %}">Login Here</a>
        </div>
        <div class="wordsearch">
            <a class="play" href="{% url 'wordsearch:home' %}"> PLAY WORDSEARCH</a>
             
            <a class="play" href="{% url 'sudoku' %}"> SUDOKU</a>
            <p>{{sentence}}</p>
            {% if user.is_authenticated %}
            <a href="{% url 'logout' %}">Logout</a>
            {% endif %}
            <a class="metrics" href="{% url 'metrics'%}">📊</a>
        </div>
    </body>
</html>
