{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'login.css' %}">
    
</head>
<body>
     

<form  method="post">
    {% csrf_token %}
    <h2>LOGIN</h2>
    {% if error %}
    <p class="error">{{error}}</p>
    {% endif %}
      <input type="text" name="username" placeholder="Username" required> 
  <input type="password" name="password" placeholder="Password" required> 
  <button type="submit">Login</button>

</form>
<p style="text-align:center;" class="message">Don't have an account?  <a href="{% url "register" %}">Create here</a>  

</p>
<p style="text-align:center;" class="home"><a class="home" href="{% url 'user' %}">HOME</a></p>


</body>
</html>
