<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body{
            background-color: #000;
            color: blanchedalmond;
        }
        form{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 10px;
        }
        h2{
            font-size: 40px;
        }
        input{
            background-color: rgb(74, 78, 83);
            color: rgb(24, 182, 48);
            font-size: 25px;
            padding: 5px;
            border-radius: 10px;
            outline: none;
            border: none;
        }
        input:hover{
            background-color: rgb(39, 44, 49);
        }

        button{
            font-size: 25px;
            padding: 5px 20px;
            border-radius: 10px;
        }
        button:hover{
            background-color: darkgrey;
            border: none;
        }
    </style>
</head>
<body>
     

<form  method="post">
    {% csrf_token %}
    <h2>LOGIN</h2>
    {% if error %}
    <p>{{error}}</p>
    {% endif %}
      <input type="text" name="username" placeholder="Username" required><br>
  <input type="password" name="password" placeholder="Password" required><br>
  <button type="submit">Login</button>

</form>


</body>
</html>
